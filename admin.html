<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Elvish Army Admin</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    background: #080808;
    color: white;
    padding: 20px;
}

.container {
    max-width: 800px;
    margin: auto;
}

.header {
    background: #111;
    padding: 20px;
    border-radius: 18px;
    border: 1px solid #292929;
    margin-bottom: 20px;
}

.header span {
    color: #f5b400;
}

.card {
    background: #111;
    border: 1px solid #292929;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
}

input,
textarea {
    width: 100%;
    background: #191919;
    color: white;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 13px;
    margin-bottom: 12px;
}

textarea {
    min-height: 100px;
}

button {
    border: none;
    border-radius: 10px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: bold;
}

.primary {
    background: #f5b400;
    color: #000;
    width: 100%;
}

.delete {
    background: #2a1717;
    color: #ff7070;
    margin-top: 10px;
}

.edit {
    background: #222;
    color: #f5b400;
    margin-top: 10px;
    margin-right: 5px;
}

.item {
    background: #181818;
    border: 1px solid #292929;
    border-radius: 14px;
    padding: 15px;
    margin-top: 12px;
}

.item h3 {
    margin-bottom: 7px;
}

.item p {
    color: #bbb;
    margin-top: 8px;
    line-height: 1.5;
}

.tabs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
}

.tab {
    background: #181818;
    color: #aaa;
    padding: 12px 5px;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
}

.tab.active {
    background: #f5b400;
    color: #000;
}

.hidden {
    display: none;
}

#login {
    max-width: 420px;
    margin: 60px auto;
}

.message {
    color: #f5b400;
    margin-top: 10px;
}

</style>

</head>


<body>


<!-- LOGIN -->

<div id="login">

<div class="card">

<h1>👑 ELVISH <span style="color:#f5b400">ARMY</span></h1>

<p style="color:#777;margin:10px 0 20px;">
Admin Login
</p>

<input
id="username"
placeholder="Username"
>

<input
id="password"
type="password"
placeholder="Password"
>

<button
class="primary"
onclick="login()"
>
LOGIN 🔐
</button>

<p id="loginMessage"
class="message">
</p>

</div>

</div>


<!-- ADMIN -->

<div
id="admin"
class="container hidden"
>

<div class="header">

<h1>
👑 ELVISH <span>ARMY</span>
</h1>

<p style="color:#777;margin-top:7px;">
Admin Control Panel
</p>

<button
class="delete"
onclick="logout()"
>
Logout
</button>

</div>


<!-- TABS -->

<div class="tabs">

<div
class="tab active"
onclick="showTab('news',this)"
>
📰 News
</div>

<div
class="tab"
onclick="showTab('videos',this)"
>
🎬 Videos
</div>

<div
class="tab"
onclick="showTab('photos',this)"
>
📸 Photos
</div>

<div
class="tab"
onclick="showTab('updates',this)"
>
🔥 Updates
</div>

<div class="tab" onclick="showTab('polls',this)">
    🗳️ Polls
</div>

<div class="tab" onclick="showTab('community',this)">
    👥 Community
</div>

<div class="tab" onclick="showTab('notifications',this)">
    🔔 Notifications
</div>

<div class="tab" onclick="showTab('dashboard',this)">
    📊 Dashboard
</div>

</div>


<!-- NEWS -->

<div id="news" class="card">

<h2>📰 News</h2>

<br>

<input
id="newsTitle"
placeholder="News title"
>

<textarea
id="newsDescription"
placeholder="News description"
></textarea>

<button
class="primary"
onclick="addNews()"
>
ADD NEWS
</button>

<div id="newsList"></div>

</div>


<!-- VIDEOS -->

<div id="videos" class="card hidden">

<h2>🎬 Videos</h2>

<br>

<input
id="videoTitle"
placeholder="Video title"
>

<input
id="videoUrl"
placeholder="YouTube / Video URL"
>

<input
id="videoThumbnail"
placeholder="Thumbnail URL (optional)"
>

<button
class="primary"
onclick="addVideo()"
>
ADD VIDEO
</button>

<div id="videoList"></div>

</div>


<!-- PHOTOS -->

<div id="photos" class="card hidden">

<h2>📸 Photos</h2>

<br>

<input
id="photoTitle"
placeholder="Photo title"
>

<input
id="photoUrl"
placeholder="Image URL"
>

<button
class="primary"
onclick="addPhoto()"
>
ADD PHOTO
</button>

<div id="photoList"></div>

</div>


<!-- POLLS -->

<div id="polls" class="card hidden">

    <h2>🗳️ Create Poll</h2>

    <br>

    <input id="pollQuestion"
           placeholder="Poll question">

    <input id="pollOption1"
           placeholder="Option 1">

    <input id="pollOption2"
           placeholder="Option 2">

    <button class="primary"
            onclick="createPoll()">
        CREATE POLL
    </button>

    <div id="pollList"></div>

</div>


<!-- COMMUNITY -->

<div id="community" class="card hidden">

    <h2>👥 Community Posts</h2>

    <br>

    <input id="communityUsername"
           placeholder="Username">

    <textarea id="communityContent"
              placeholder="Post content"></textarea>

    <button class="primary"
            onclick="createPost()">
        CREATE POST
    </button>

    <div id="communityList"></div>

</div>


<!-- NOTIFICATIONS -->

<div id="notifications" class="card hidden">

    <h2>🔔 Send Notification</h2>

    <br>

    <input id="notificationTitle"
           placeholder="Notification title">

    <textarea id="notificationMessage"
              placeholder="Notification message"></textarea>

    <button class="primary"
            onclick="sendNotification()">
        SEND NOTIFICATION 🔔
    </button>

    <div id="notificationList"></div>

</div>


<!-- DASHBOARD -->

<div id="dashboard" class="card hidden">

    <h2>📊 Dashboard</h2>

    <br>

    <div id="dashboardStats">
        Loading statistics...
    </div>

</div>


<!-- UPDATES -->

<div id="updates" class="card hidden">

<h2>🔥 Updates</h2>

<br>

<input
id="updateTitle"
placeholder="Update title"
>

<textarea
id="updateDescription"
placeholder="Write update..."
></textarea>

<button
class="primary"
onclick="addUpdate()"
>
PUBLISH UPDATE
</button>

<div id="updateList"></div>

</div>


</div>


<script>

const API = "https://elvish-army.onrender.com";

let token = localStorage.getItem("adminToken");


/* =========================
LOGIN
========================= */

async function login() {

    const username =
        document.getElementById("username").value;

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");

    try {

        const response = await fetch(
            `${API}/api/admin/login`,
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username,
                    password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail);
        }

        token = data.token;

        localStorage.setItem(
            "adminToken",
            token
        );

        showAdmin();

    } catch (error) {

        message.innerText =
            error.message || "Login failed";

    }

}

// =====================================================
// POLLS
// =====================================================

async function createPoll() {

    const question =
        document.getElementById("pollQuestion").value;

    const option1 =
        document.getElementById("pollOption1").value;

    const option2 =
        document.getElementById("pollOption2").value;

    if (!question || !option1 || !option2) {
        alert("Poll details bhar bhai.");
        return;
    }

    await fetch(`${API}/api/polls`, {

        method: "POST",

        headers: headers(),

        body: JSON.stringify({
            question,
            option1,
            option2
        })

    });

    document.getElementById("pollQuestion").value = "";
    document.getElementById("pollOption1").value = "";
    document.getElementById("pollOption2").value = "";

    loadPolls();
}


async function loadPolls() {

    const response =
        await fetch(`${API}/api/polls`);

    const data =
        await response.json();

    const list =
        document.getElementById("pollList");

    list.innerHTML = "";

    data.polls.forEach(poll => {

        list.innerHTML += `

            <div class="item">

                <h3>${poll.question}</h3>

                <p>
                    ${poll.option1}:
                    ${poll.votes1} votes
                </p>

                <p>
                    ${poll.option2}:
                    ${poll.votes2} votes
                </p>

                <button
                    class="delete"
                    onclick="deletePoll(${poll.id})">
                    🗑️ Delete
                </button>

            </div>

        `;

    });
}


async function deletePoll(id) {

    if (!confirm("Delete this poll?")) return;

    await fetch(`${API}/api/polls/${id}`, {

        method: "DELETE",

        headers: headers()

    });

    loadPolls();
}


// =====================================================
// COMMUNITY
// =====================================================

async function createPost() {

    const username =
        document.getElementById(
            "communityUsername"
        ).value;

    const content =
        document.getElementById(
            "communityContent"
        ).value;

    if (!username || !content) {
        alert("Post details bhar bhai.");
        return;
    }

    await fetch(`${API}/api/community`, {

        method: "POST",

        headers: headers(),

        body: JSON.stringify({
            username,
            content
        })

    });

    document.getElementById(
        "communityUsername"
    ).value = "";

    document.getElementById(
        "communityContent"
    ).value = "";

    loadCommunity();
}


async function loadCommunity() {

    const response =
        await fetch(`${API}/api/community`);

    const data =
        await response.json();

    const list =
        document.getElementById(
            "communityList"
        );

    list.innerHTML = "";

    data.posts.forEach(post => {

        list.innerHTML += `

            <div class="item">

                <h3>
                    👤 ${post.username}
                </h3>

                <p>
                    ${post.content}
                </p>

                <button
                    class="delete"
                    onclick="deleteCommunity(${post.id})">
                    🗑️ Delete
                </button>

            </div>

        `;

    });
}


async function deleteCommunity(id) {

    if (!confirm("Delete this post?")) return;

    await fetch(
        `${API}/api/community/${id}`,
        {
            method: "DELETE",
            headers: headers()
        }
    );

    loadCommunity();
}


// =====================================================
// NOTIFICATIONS
// =====================================================

async function sendNotification() {

    const title =
        document.getElementById(
            "notificationTitle"
        ).value;

    const message =
        document.getElementById(
            "notificationMessage"
        ).value;

    if (!title || !message) {
        alert("Notification details bhar bhai.");
        return;
    }

    await fetch(
        `${API}/api/notifications`,
        {
            method: "POST",

            headers: headers(),

            body: JSON.stringify({
                title,
                message
            })
        }
    );

    document.getElementById(
        "notificationTitle"
    ).value = "";

    document.getElementById(
        "notificationMessage"
    ).value = "";

    loadNotifications();
}


async function loadNotifications() {

    try {

        const response = await fetch(
            `${API}/api/notifications`
        );

        if (response.status === 401) {
            console.log("Notification admin auth required");
            return;
        }

        const data = await response.json();

        const list =
            document.getElementById("notificationList");

        list.innerHTML = "";

        data.notifications.forEach(item => {

            list.innerHTML += `

                <div class="item">

                    <h3>🔔 ${item.title}</h3>

                    <p>${item.message}</p>

                    <small>
                        ${item.created_at}
                    </small>

                    <br>

                    <button
                        class="delete"
                        onclick="deleteNotification(${item.id})">
                        🗑️ Delete
                    </button>

                </div>

            `;

        });

    } catch (error) {

        console.error(
            "Notifications error:",
            error
        );

    }

}

async function deleteNotification(id) {

    if (!confirm("Delete notification?")) return;

    await fetch(
        `${API}/api/notifications/${id}`,
        {
            method: "DELETE",
            headers: headers()
        }
    );

    loadNotifications();
}


// =====================================================
// DASHBOARD
// =====================================================

async function loadDashboard() {

    try {

        const response = await fetch(
            `${API}/api/admin/dashboard`,
            {
                headers: headers()
            }
        );

        if (response.status === 401) {

            localStorage.removeItem("adminToken");

            alert("Admin login expired. Please login again.");

            location.reload();

            return;
        }

        const data = await response.json();

        if (!data.stats) {

            console.error(
                "Dashboard response:",
                data
            );

            return;
        }

        const s = data.stats;

        document.getElementById(
            "dashboardStats"
        ).innerHTML = `

            <div class="item">
                👤 Users:
                <strong>${s.users}</strong>
            </div>

            <div class="item">
                👁️ Views:
                <strong>${s.views}</strong>
            </div>

            <div class="item">
                🔥 Updates:
                <strong>${s.updates}</strong>
            </div>

            <div class="item">
                📰 News:
                <strong>${s.news}</strong>
            </div>

            <div class="item">
                🎬 Videos:
                <strong>${s.videos}</strong>
            </div>

            <div class="item">
                📸 Photos:
                <strong>${s.photos}</strong>
            </div>

            <div class="item">
                🗳️ Polls:
                <strong>${s.polls}</strong>
            </div>

            <div class="item">
                👥 Community:
                <strong>${s.community_posts}</strong>
            </div>

            <div class="item">
                🔔 Notifications:
                <strong>${s.notifications}</strong>
            </div>

        `;

    } catch (error) {

        console.error(
            "Dashboard error:",
            error
        );

    }

}


/* =========================
AUTH HEADERS
========================= */

function headers() {

    return {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
    };

}


/* =========================
SHOW ADMIN
========================= */

function showAdmin() {

    document
        .getElementById("login")
        .classList.add("hidden");

    document
        .getElementById("admin")
        .classList.remove("hidden");

    loadNews();
    loadVideos();
    loadPhotos();
    loadUpdates();
    loadPolls();
    loadCommunity();
    loadNotifications();
    loadDashboard();

}


/* =========================
TABS
========================= */

function showTab(id, element) {

    document
        .querySelectorAll(".card")
        .forEach(card => {

            if (
                ["news","videos","photos","updates"]
                .includes(card.id)
            ) {
                card.classList.add("hidden");
            }

        });

    document
        .getElementById(id)
        .classList.remove("hidden");

    document
        .querySelectorAll(".tab")
        .forEach(tab =>
            tab.classList.remove("active")
        );

    element.classList.add("active");

}


/* =========================
NEWS
========================= */

async function addNews() {

    const title =
        document.getElementById("newsTitle").value;

    const description =
        document.getElementById("newsDescription").value;

    if (!title || !description) {
        alert("News details bhar bhai.");
        return;
    }

    await fetch(`${API}/api/news`, {

        method: "POST",

        headers: headers(),

        body: JSON.stringify({
            title,
            description
        })

    });

    document.getElementById("newsTitle").value = "";
    document.getElementById("newsDescription").value = "";

    loadNews();

}


async function loadNews() {

    const response =
        await fetch(`${API}/api/news`);

    const data =
        await response.json();

    const list =
        document.getElementById("newsList");

    list.innerHTML = "";

    data.news.forEach(item => {

        list.innerHTML += `

        <div class="item">

            <h3>${item.title}</h3>

            <small>${item.date}</small>

            <p>${item.description}</p>

            <button
                class="edit"
                onclick="editNews(${item.id})"
            >
                ✏️ Edit
            </button>

            <button
                class="delete"
                onclick="deleteNews(${item.id})"
            >
                🗑️ Delete
            </button>

        </div>

        `;

    });

}


async function editNews(id) {

    const title =
        prompt("New title:");

    if (!title) return;

    const description =
        prompt("New description:");

    if (!description) return;

    await fetch(`${API}/api/news/${id}`, {

        method: "PUT",

        headers: headers(),

        body: JSON.stringify({
            title,
            description
        })

    });

    loadNews();

}


async function deleteNews(id) {

    if (!confirm("Delete this news?")) return;

    await fetch(`${API}/api/news/${id}`, {

        method: "DELETE",

        headers: headers()

    });

    loadNews();

}


/* =========================
VIDEOS
========================= */

async function addVideo() {

    const title =
        document.getElementById("videoTitle").value;

    const url =
        document.getElementById("videoUrl").value;

    const thumbnail =
        document.getElementById("videoThumbnail").value;

    if (!title || !url) {
        alert("Video details bhar bhai.");
        return;
    }

    await fetch(`${API}/api/videos`, {

        method: "POST",

        headers: headers(),

        body: JSON.stringify({
            title,
            url,
            thumbnail
        })

    });

    document.getElementById("videoTitle").value = "";
    document.getElementById("videoUrl").value = "";
    document.getElementById("videoThumbnail").value = "";

    loadVideos();

}


async function loadVideos() {

    const response =
        await fetch(`${API}/api/videos`);

    const data =
        await response.json();

    const list =
        document.getElementById("videoList");

    list.innerHTML = "";

    data.videos.forEach(item => {

        list.innerHTML += `

        <div class="item">

            <h3>${item.title}</h3>

            <p>${item.url}</p>

            <button
                class="delete"
                onclick="deleteVideo(${item.id})"
            >
                🗑️ Delete
            </button>

        </div>

        `;

    });

}


async function deleteVideo(id) {

    if (!confirm("Delete this video?")) return;

    await fetch(`${API}/api/videos/${id}`, {

        method: "DELETE",

        headers: headers()

    });

    loadVideos();

}


/* =========================
PHOTOS
========================= */

async function addPhoto() {

    const title =
        document.getElementById("photoTitle").value;

    const image_url =
        document.getElementById("photoUrl").value;

    if (!title || !image_url) {
        alert("Photo details bhar bhai.");
        return;
    }

    await fetch(`${API}/api/photos`, {

        method: "POST",

        headers: headers(),

        body: JSON.stringify({
            title,
            image_url
        })

    });

    document.getElementById("photoTitle").value = "";
    document.getElementById("photoUrl").value = "";

    loadPhotos();

}


async function loadPhotos() {

    const response =
        await fetch(`${API}/api/photos`);

    const data =
        await response.json();

    const list =
        document.getElementById("photoList");

    list.innerHTML = "";

    data.photos.forEach(item => {

        list.innerHTML += `

        <div class="item">

            <h3>${item.title}</h3>

            <img
                src="${item.image_url}"
                style="
                    width:100%;
                    border-radius:12px;
                    margin-top:10px;
                "
            >

            <button
                class="delete"
                onclick="deletePhoto(${item.id})"
            >
                🗑️ Delete
            </button>

        </div>

        `;

    });

}


async function deletePhoto(id) {

    if (!confirm("Delete this photo?")) return;

    await fetch(`${API}/api/photos/${id}`, {

        method: "DELETE",

        headers: headers()

    });

    loadPhotos();

}


/* =========================
UPDATES
========================= */

async function addUpdate() {

    const title =
        document.getElementById("updateTitle").value;

    const description =
        document.getElementById("updateDescription").value;

    if (!title || !description) {
        alert("Update details bhar bhai.");
        return;
    }

    await fetch(`${API}/api/updates`, {

        method: "POST",

        headers: headers(),

        body: JSON.stringify({
            title,
            description
        })

    });

    document.getElementById("updateTitle").value = "";
    document.getElementById("updateDescription").value = "";

    loadUpdates();

}


async function loadUpdates() {

    const response =
        await fetch(`${API}/api/updates`);

    const data =
        await response.json();

    const list =
        document.getElementById("updateList");

    list.innerHTML = "";

    data.updates.forEach(item => {

        list.innerHTML += `

        <div class="item">

            <h3>${item.title}</h3>

            <small>${item.time}</small>

            <p>${item.description}</p>

            <button
                class="delete"
                onclick="deleteUpdate(${item.id})"
            >
                🗑️ Delete
            </button>

        </div>

        `;

    });

}


async function deleteUpdate(id) {

    if (!confirm("Delete this update?")) return;

    await fetch(`${API}/api/updates/${id}`, {

        method: "DELETE",

        headers: headers()

    });

    loadUpdates();

}


/* =========================
LOGOUT
========================= */

async function logout() {

    await fetch(`${API}/api/admin/logout`, {

        method: "POST",

        headers: headers()

    });

    localStorage.removeItem("adminToken");

    location.reload();

}


/* =========================
START
========================= */

if (token) {
    showAdmin();
}

</script>

</body>
</html>
